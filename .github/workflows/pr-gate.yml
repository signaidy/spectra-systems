name: PR Gate (Nexus - Sonar + Tests)

on:
  pull_request:
    branches: [ "dev", "uat", "master" ]
    paths:
      - "nexus-agency-system/backend/**"
      - ".github/workflows/**"
      - "Jenkinsfile"

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-agency-system/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build + Unit tests
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test jacocoTestReport build 2>&1 | tee build.log

      - name: SonarQube Scan (Quality Gate)
        id: sonar
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true 2>&1 | tee sonar.log

      - name: Collect error details (on failure)
        if: ${{ failure() }}
        id: err
        shell: bash
        run: |
          {
            echo "error_message<<EOF"
            echo "=== Build (tail) ==="
            tail -n 80 build.log || true
            echo
            echo "=== Sonar (tail) ==="
            tail -n 80 sonar.log || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify (Success)
        if: ${{ success() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: "${{ secrets.SMTP_USERNAME }}"
          to: "${{ secrets.MAIL_TO_LEAD }},${{ secrets.MAIL_TO_PO }}"
          subject: "Test Merge for pull request #${{ github.event.pull_request.number }} success for spectra system ${{ github.base_ref }}"
          body: |
            Pull Request #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            Autor: ${{ github.actor }}
            Origen: ${{ github.head_ref }}
            Destino: ${{ github.base_ref }}

            Resultado: success

            Ver PR:
            ${{ github.event.pull_request.html_url }}

      - name: Notify (Failure)
        if: ${{ failure() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: "${{ secrets.SMTP_USERNAME }}"
          to: "${{ secrets.MAIL_TO_LEAD }},${{ secrets.MAIL_TO_PO }}"
          subject: "Test Merge for pull request #${{ github.event.pull_request.number }} fail for spectra system ${{ github.base_ref }}"
          body: |
            Pull Request #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            Autor: ${{ github.actor }}
            Origen: ${{ github.head_ref }}
            Destino: ${{ github.base_ref }}

            Resultado: failure

            Detalles de error (últimas líneas):
            ${{ steps.err.outputs.error_message }}

            Ver PR:
            ${{ github.event.pull_request.html_url }}