services:
  nexus:
    build: .
    image: nexus-app:uat
    container_name: nexus-uat
    env_file: .env.uat
    ports:
      - "8082:8080"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: nexus-db-uat
    environment:
      MYSQL_DATABASE: nexus_uat
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - nexus-uat-db:/var/lib/mysql

volumes:
  nexus-uat-db:
