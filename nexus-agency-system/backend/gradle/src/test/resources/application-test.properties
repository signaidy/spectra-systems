# ===== Datasource (Oracle) =====
# Usa variables de entorno con defaults seguros para local:
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1}
spring.datasource.username=${DB_USER:NEXUS_DEV}
spring.datasource.password=${DB_PASS:dev_pass}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialecto y DDL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Perfil activo por env =====
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== Server =====
server.port=${PORT:8080}

# ===== JWT =====
token.expirationms=${JWT_EXPIRATION_MS:28800000}
token.secret.key=${JWT_SECRET:change-me}

# ===== Estrategia de nombres =====
spring.jpa.properties.hibernate.physical_naming_strategy=SpectraSystems.Nexus.config.DynamicTableNamingStrategy